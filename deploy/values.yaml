# Values for the platform chart (otterworks platform/standards/helm/app).
app: fineract-web-app
owner: mifos-web-team
costCenter: BANK-WEB-0001
workload: web

containerPort: 8080

# Rendered into assets/env.js at container start (see server/server.js).
# Unset variables fall back to the defaults in src/environments.
env:
  FINERACT_API_URLS: https://localhost:8443
  FINERACT_API_URL: https://localhost:8443
  FINERACT_API_PROVIDER: /fineract-provider/api
  FINERACT_API_VERSION: /v1
  FINERACT_PLATFORM_TENANT_IDENTIFIER: default
  MIFOS_DEFAULT_LANGUAGE: en-US
  MIFOS_SUPPORTED_LANGUAGES: cs-CS,de-DE,en-US,es-MX,es-CL,fr-FR,it-IT,ko-KO,lt-LT,lv-LV,ne-NE,pt-PT,sw-SW
  MIFOS_SESSION_IDLE_TIMEOUT: '300000'
  MIFOS_PRELOAD_CLIENTS: 'true'
  MIFOS_DEFAULT_CHAR_DELIMITER: ','

writablePaths:
  - /tmp

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi
