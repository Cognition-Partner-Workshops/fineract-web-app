@if (pdfUrl) {
  <iframe [src]="pdfUrl" title="Report" frameborder="0" width="100%" [style.height]="height"></iframe>
} @else if (html !== null) {
  <div [innerHTML]="html"></div>
} @else if (downloadUrl) {
  <a [href]="downloadUrl" [download]="downloadName">{{ 'labels.buttons.Download' | translate }}</a>
} @else {
  <p>Unable to load report.</p>
}
